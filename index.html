<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#131a2e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Pic Collage Maker — Photo Collage Editor</title>
    <meta
      name="description"
      content="Free photo collage maker that runs entirely in your browser. Grids, freehand layouts, filters, text and stickers — no account, no uploads, and your photos never leave your device."
    />
    <link rel="canonical" href="https://sashimee.github.io/Pic-collage/" />

    <!-- Social preview. Crawlers don't resolve relative URLs, so these are
         absolute and must be kept in step with BASE in vite.config.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pic Collage Maker" />
    <meta property="og:url" content="https://sashimee.github.io/Pic-collage/" />
    <meta property="og:title" content="Pic Collage Maker — make a collage, your photos never leave your phone" />
    <meta
      property="og:description"
      content="Free photo collage maker that runs entirely in your browser. Grids, freehand layouts, filters, text and stickers — no account, no uploads, no app store. Your photos never leave your device."
    />
    <meta property="og:image" content="https://sashimee.github.io/Pic-collage/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pic Collage Maker — a photo collage laid out in a grid" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="it_IT" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pic Collage Maker — make a collage, your photos never leave your phone" />
    <meta
      name="twitter:description"
      content="Free photo collage maker that runs entirely in your browser. No account, no uploads — your photos never leave your device."
    />
    <meta name="twitter:image" content="https://sashimee.github.io/Pic-collage/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
